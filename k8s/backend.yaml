apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentra-backend
  namespace: blind-spot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentra-backend
  template:
    metadata:
      labels:
        app: sentra-backend
    spec:
      containers:
      - name: sentra-backend
        image: praktikan/sentra-backend:latest
        ports:
        - containerPort: 4000
        env:
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: sentra-config
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sentra-secret
              key: db-password
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: sentra-config
              key: db-host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: sentra-config
              key: db-port
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: sentra-config
              key: db-name
        - name: DATABASE_URL
          value: "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?schema=public"
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: sentra-secret
              key: gemini-api-key
        - name: GEMINI_MODEL
          valueFrom:
            configMapKeyRef:
              name: sentra-config
              key: gemini-model
        - name: JWT_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: sentra-secret
              key: jwt-access-secret
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: sentra-secret
              key: jwt-refresh-secret
        - name: PORT
          value: "4000"
---
apiVersion: v1
kind: Service
metadata:
  name: sentra-backend
  namespace: blind-spot
spec:
  selector:
    app: sentra-backend
  ports:
  - protocol: TCP
    port: 4000
    targetPort: 4000
