apiVersion: v1
kind: Secret
metadata:
  name: sentra-backend-secrets
type: Opaque
stringData:
  database-url: "postgresql://postgres:postgres@postgres:5432/sentra_test?schema=public"
  jwt-access-secret: "replace-with-access-secret"
  jwt-refresh-secret: "replace-with-refresh-secret"
  gemini-api-key: "replace-with-gemini-key"
