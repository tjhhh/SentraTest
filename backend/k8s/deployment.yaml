apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentra-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentra-backend
  template:
    metadata:
      labels:
        app: sentra-backend
    spec:
      containers:
        - name: backend
          image: sentra-backend:latest
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sentra-backend-secrets
                  key: database-url
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: sentra-backend-secrets
                  key: jwt-access-secret
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: sentra-backend-secrets
                  key: jwt-refresh-secret
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sentra-backend-secrets
                  key: gemini-api-key
