version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentra-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sentra_prod}
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    volumes:
      - sentra-postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sentra_prod}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: sentra-backend-prod
    shm_size: '2gb'
    ipc: host
    secrets:
      - jwt_access_secret
      - jwt_refresh_secret
      - gemini_api_key
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sentra_prod}?schema=public
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash-exp}
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 100
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    command: [ "sh", "-c", "npx prisma migrate deploy && node src/server.js" ]

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: sentra-frontend-prod
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

secrets:
  jwt_access_secret:
    file: ./secrets/jwt_access_secret.txt
  jwt_refresh_secret:
    file: ./secrets/jwt_refresh_secret.txt
  gemini_api_key:
    file: ./secrets/gemini_api_key.txt

volumes:
  sentra-postgres-prod-data: